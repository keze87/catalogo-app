apiVersion: v1
kind: Pod
metadata:
  labels:
    run: catalogo-db
  name: catalogo-db
spec:
  containers:
  - image: mongo:7
    name: catalogo-db
    ports:
    - containerPort: 27017
    env:
      - name: MONGO_INITDB_ROOT_USERNAME
        value: catalogo_user
      - name: MONGO_INITDB_ROOT_PASSWORD
        value: catalogo_pass
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
