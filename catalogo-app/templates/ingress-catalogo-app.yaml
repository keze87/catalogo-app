apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalogo-app-ingress
  namespace: {{ .Release.Namespace }}
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalogo-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
